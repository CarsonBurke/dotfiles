# Reference copy of the authored parts of ~/.codex/config.toml.
#
# config.toml itself is intentionally untracked: Codex writes machine-local
# state into it (64+ [projects.*] trust entries and [hooks.state] hashes, all
# keyed by absolute paths that are wrong on any other machine). Tracking it
# meant every sync churned or conflicted.
#
# New machine: cp config.example.toml config.toml
# Changed a real setting: mirror it here so the other machine picks it up.
#
# Note: the two command-based MCP servers below are path-dependent and may need
# adjusting per machine (`/usr/bin/uv` is the Linux location; `ibkr` resolves
# relative to the cwd Codex is launched from).

approval_policy = "never"
sandbox_mode = "danger-full-access"
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"
approvals_reviewer = "user"
service_tier = "default"

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[mcp_servers.paper]
url = "http://127.0.0.1:29979/mcp"

[mcp_servers.ibkr]
command = "target/release/ibkr-mcp"

[mcp_servers.redact-archive]
url = "http://127.0.0.1:4488/mcp"

[mcp_servers.chebi]
command = "/usr/bin/uv"
args = ["--directory", "chebi-mcp", "run", "chebi-mcp"]

[notice]
hide_gpt5_1_migration_prompt = true
"hide_gpt-5.1-codex-max_migration_prompt" = true
hide_rate_limit_model_nudge = true
hide_full_access_warning = true

[notice.model_migrations]
"gpt-5.2" = "gpt-5.2-codex"
"gpt-5.1-codex-max" = "gpt-5.2-codex"

[features]
experimental_use_rmcp_client = true
multi_agent = true

[tui]
theme = "catppuccin-mocha"
status_line = ["model-with-reasoning", "git-branch", "project-name", "context-used"]

[desktop]
usePointerCursors = true
followUpQueueMode = "steer"
preventSleepWhileRunning = false
keepRemoteControlAwakeWhilePluggedIn = false
conversationDetailMode = "STEPS_EXECUTION"
